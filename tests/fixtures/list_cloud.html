			var url = "";
			if (redit == 0 || redit == 4) {
				url = _HOST_CP2_+ "/work/doHomeWorkNew?courseId=" + courseId + "&classId=" + classId + "&workId=" + workRelationId + "&workAnswerId="
					+ workRelationAnswerId + "&isdisplaytable=2&mooc=1&enc=1111aaaa2222bbbb3333cccc4444dd06&workSystem=0&cpi=414822001&openc=1111aaaa2222bbbb3333cccc4444dd05&standardEnc=";
			} else if (redit == 1) {
				url = _HOST_CP2_+ "/work/doHomeWorkNew?courseId=" + courseId + "&classId=" + classId + "&workId=" + workRelationId + "&workAnswerId="
					+ workRelationAnswerId + "&reEdit=1&isdisplaytable=2&mooc=1&enc=1111aaaa2222bbbb3333cccc4444dd06&workSystem=0&cpi=414822001&openc=1111aaaa2222bbbb3333cccc4444dd05&standardEnc=";
			}
            if ($("#reddot" + workRelationId).css("display") == "block") {
                $.ajax({
                    type: "get",
                    dataType: "json",
                    url: _HOST_CP2_ + "/api/removeworkreddot",
                    data: {
                        "classId": "153554001",
                        "courseId": "266665001",
                        "ut": "s",
                        "taskRefId": workRelationId,
                        "type": "work",
                        "cpi": cpi
                    }, success: function (data) {
                    }
                });
            }
            $.ajax({
				type : "get",
				dataType : "json",
				url : _HOST_CP2_ + "/work/isExpire",
				data : {
					"classId" : classId,
					"workRelationId" : workRelationId,
					"cpi": cpi,
					"courseId" : courseId
				},
				success : function(json) {
					if (json.status == "1") {
						$("#tipUnfinish").text("章节任务点未完成" + json.finishStandard + "%，不能做作业。");
						WAY.box.show({
							'divid' : 'tipUnfinishWin'
						});
					} else if (json.status == "0") {
						var standardEnc = json.standardEnc;
						var sUrl = url + standardEnc;
						if (redit == 4) {

							var cont = "本次成绩";
							if (redoHighest == 1) {
								cont = "最高成绩";
							}
							var tips = "你还可以重做" + redoTimes + "次，确认重做后，前一次作答记录会被覆盖，作业成绩以" + cont + "为最终成绩，是否继续？";
							$("#redoTips").text(tips);
							
							WAY.box.show({'divid' : 'reWork'});
							$("#reWorkBtn").unbind();
							$("#reWorkBtn").click(function() {
								if (lock == 0) {
									return;
								}
								lock = 0;
								redo(courseId, classId, workRelationId, workRelationAnswerId, sUrl);
							});
						} else {
							location.href = sUrl;
						}
					}
				}
			});
		});
	});
	
	function redo(courseId, classId, workId, workAnswerId, url) {
		$.ajax({
			type : "get",
			url : _HOST_CP2_ + "/work/phone/redo",
			dataType : "json",
			data : {
				"workId" : workId,
				"classId" : classId,
				"courseId" : courseId,
				"workAnswerId" : workAnswerId
			},
			success : function(data) {
				if(data.status == 1) {
					location.href = url;
				} else {
					$("#tipUnfinish").text(data.msg);
					WAY.box.show({
						'divid' : 'tipUnfinishWin'
					});
					lock = 1;
				}
			}
		});
	}
	
	function clicked(ele, e) {
		e = e || window.event;
		var ul = ele.getElementsByTagName("ul")[0];
	
		var height = ul.getElementsByTagName("li").length * 23;
		height = height > 200 ? "200px" : (height + "px");
		ul.style.height = height;
	
		ul.style.display = ul.style.display == "block" ? "none" : "block";
		stopPropagation(e);
		return false;
	}
	
	function checkIt(ele, value) {
		var sw = $("#sw").val();
		var p = ele.parentNode.parentNode.parentNode.getElementsByTagName("p")[0];
		p.innerText = ele.innerText;
	
		if (sw.replace(/(^\s*)|(\s*$)/, '') == "请输入关键字") {
			sw = "";
		}
		location.href = "/mooc-ans/work/getAllWork?classId=153554001&courseId=266665001&status=" + value + "&sw=" + sw 
			+ "&isdisplaytable=2&mooc=1&ut=s";
		return false;
	}
	
	// 根据关键词检索作业
	function searchWork() {
		var sw = $("#sw").val();
		if (sw.replace(/(^\s*)|(\s*$)/, '') == '' || sw.replace(/(^\s*)|(\s*$)/, '') == "请输入关键字") {
			alert("请输入关键字");
		} else {
			var status = $("#status").val();
			location.href = "/mooc-ans/work/getAllWork?classId=153554001&courseId=266665001&status=" + status + "&sw=" 
				+ sw + "&isdisplaytable=2&mooc=1&ut=s";
		}
	}
	
	function stopPropagation(event) {
		if (event.stopPropagation) {
			event.stopPropagation();
		} else {
			event.cancelBubble = true;
		}
	}
	
	page.showPage(1, 1, "changePage", "首页", "尾页");
	function changePage(pageNum) {
		location.href = "/mooc-ans/work/getAllWork?courseId=266665001&classId=153554001&pageNum=" 
			+ pageNum + "&isdisplaytable=2&mooc=1&ut=s&enc=1111aaaa2222bbbb3333cccc4444dd04";
	}
</script>
